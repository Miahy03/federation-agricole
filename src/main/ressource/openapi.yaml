openapi: 3.0.3

info:
  title: Federation API
  version: 0.0.3
  description: API de gestion des collectivités agricoles, membres, cotisations et paiements

servers:
  - url: http://localhost:8080

paths:

  /collectivities:
    post:
      summary: Créer une nouvelle collectivité (Fonctionnalité A)
      operationId: createCollectivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityRequest'
      responses:
        "201":
          description: Collectivité créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectivityResponse'
        "400":
          description: Conditions non remplies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /collectivities/{id}:
    get:
      summary: Obtenir une collectivité par son ID
      operationId: getCollectivityById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID de la collectivité (ex: col-1)
      responses:
        "200":
          description: Collectivité trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectivityResponse'
        "404":
          description: Collectivité non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /collectivities/{id}/informations:
    put:
      summary: Attribution du numéro et du nom unique à une collectivité (Fonctionnalité J)
      operationId: assignCollectivityInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID de la collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityAssignRequest'
      responses:
        "200":
          description: Numéro et nom attribués avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectivityResponse'
        "400":
          description: Numéro ou nom déjà utilisé ou modification interdite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Collectivité non trouvée

  /collectivities/{id}/membershipFees:
    post:
      summary: Créer des cotisations pour une collectivité (Fonctionnalité C)
      operationId: createMembershipFees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipFeeRequest'
      responses:
        "201":
          description: Cotisations créées avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipFeeListResponse'
        "404":
          description: Collectivité non trouvée

    get:
      summary: Récupérer la liste des cotisations d'une collectivité (Fonctionnalité C)
      operationId: getMembershipFees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liste des cotisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipFeeListResponse'

  /collectivities/{id}/transactions:
    get:
      summary: Récupérer les transactions d'une collectivité sur une période (Fonctionnalité D)
      operationId: getTransactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de début (YYYY-MM-DD)
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de fin (YYYY-MM-DD)
      responses:
        "200":
          description: Liste des transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'

  /collectivities/{id}/financialAccounts:
    get:
      summary: Obtenir les comptes d'une collectivité avec solde à une date (Fonctionnalité D)
      operationId: getFinancialAccounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date à laquelle calculer les soldes
      responses:
        "200":
          description: Liste des comptes avec soldes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialAccountListResponse'

  # ==================== MEMBRES ====================

  /members:
    post:
      summary: Admission d'un nouveau membre (Fonctionnalité B-2)
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdmissionRequest'
      responses:
        "201":
          description: Membre admis avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionResponse'
        "400":
          description: Conditions d'admission non remplies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /members/{id}/payments:
    post:
      summary: Enregistrer des paiements effectués par un membre (Fonctionnalité D)
      operationId: registerPayments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID du membre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        "201":
          description: Paiements enregistrés avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

components:

  schemas:

    # ==================== REQUESTS ====================

    CollectivityRequest:
      type: object
      required:
        - localite
        - specialite
        - membres
      properties:
        localite:
          type: string
          description: Ville de la collectivité
          example: "Antananarivo"
        specialite:
          type: string
          description: Spécialité agricole
          example: "Riziculture"
        membres:
          type: array
          minItems: 10
          description: Liste des membres (minimum 10)
          items:
            $ref: '#/components/schemas/MemberInput'

    MemberInput:
      type: object
      required:
        - nom
        - prenom
        - dateNaissance
        - genre
        - adresse
        - metier
        - telephone
        - email
        - poste
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          type: string
          enum: [MASCULIN, FEMININ]
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
        poste:
          type: string
          enum: [PRESIDENT, VICE_PRESIDENT, TRESORIER, SECRETAIRE, CONFIRME, JUNIOR]
        dateAdhesion:
          type: string
          format: date
        parrains:
          type: array
          description: Liste des parrains (pour les membres non fondateurs)
          items:
            $ref: '#/components/schemas/SponsorReference'

    SponsorReference:
      type: object
      required:
        - id
        - relation
      properties:
        id:
          type: string
          description: ID du parrain
          example: "C1-M1"
        relation:
          type: string
          description: Nature de la relation (famille, ami, collègue, etc.)
          enum: [FAMILLE, AMI, COLLEGUE, AUTRE]

    MemberAdmissionRequest:
      type: object
      required:
        - collectiviteId
        - membres
      properties:
        collectiviteId:
          type: string
          description: ID de la collectivité cible
          example: "col-1"
        membres:
          type: array
          items:
            $ref: '#/components/schemas/NewMemberRequest'

    NewMemberRequest:
      type: object
      required:
        - nom
        - prenom
        - dateNaissance
        - genre
        - adresse
        - metier
        - telephone
        - email
        - poste
        - parrains
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          type: string
          enum: [MASCULIN, FEMININ]
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
        poste:
          type: string
          enum: [CONFIRME, JUNIOR]
        parrains:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SponsorReference'

    CollectivityAssignRequest:
      type: object
      required:
        - numero
        - nom
      properties:
        numero:
          type: string
          description: Numéro unique de la collectivité
          example: "001"
        nom:
          type: string
          description: Nom unique de la collectivité
          example: "Firaisampokontany Antananarivo"

    MembershipFeeRequest:
      type: object
      properties:
        cotisations:
          type: array
          items:
            $ref: '#/components/schemas/MembershipFeeInput'

    MembershipFeeInput:
      type: object
      required:
        - label
        - frequence
        - montant
      properties:
        label:
          type: string
          example: "Cotisation annuelle 2026"
        frequence:
          type: string
          enum: [MONTHLY, ANNUALLY, ONE_TIME]
        montant:
          type: number
          format: double
          example: 100000
        dateDebut:
          type: string
          format: date

    PaymentRequest:
      type: object
      properties:
        paiements:
          type: array
          items:
            $ref: '#/components/schemas/PaymentInput'

    PaymentInput:
      type: object
      required:
        - montant
        - datePaiement
        - moyenPaiement
        - compteId
        - cotisationId
      properties:
        montant:
          type: number
          format: double
        datePaiement:
          type: string
          format: date
        moyenPaiement:
          type: string
          enum: [CASH, BANK_TRANSFER, MOBILE_MONEY]
        compteId:
          type: string
        cotisationId:
          type: string

    # ==================== RESPONSES ====================

    CollectivityResponse:
      type: object
      properties:
        id:
          type: string
          example: "col-1"
        numero:
          type: string
          nullable: true
          example: "001"
        nom:
          type: string
          nullable: true
          example: "Mpanorina"
        localite:
          type: string
          example: "Ambatondrazaka"
        specialite:
          type: string
          example: "Riziculture"
        dateCreation:
          type: string
          format: date
        statut:
          type: string
          enum: [EN_ATTENTE_AUTORISATION, ACTIVE, SUSPENDUE]
        membres:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'

    MemberSummary:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        prenom:
          type: string
        poste:
          type: string

    MemberResponse:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        dateAdhesion:
          type: string
          format: date
        genre:
          type: string
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
        poste:
          type: string
        collectiviteId:
          type: string

    AdmissionResponse:
      type: object
      properties:
        message:
          type: string
        adhesions:
          type: array
          items:
            type: object
            properties:
              membreId:
                type: string
              collectiviteId:
                type: string
              statut:
                type: string
              details:
                type: string

    MembershipFeeResponse:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        frequence:
          type: string
        montant:
          type: number
        statut:
          type: string
        eligibleDepuis:
          type: string
          format: date

    MembershipFeeListResponse:
      type: object
      properties:
        cotisations:
          type: array
          items:
            $ref: '#/components/schemas/MembershipFeeResponse'

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
        montant:
          type: number
        date:
          type: string
          format: date
        type:
          type: string
        membreId:
          type: string
        compteDebite:
          type: string
          nullable: true
        compteCredite:
          type: string

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'

    FinancialAccountResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CASH, BANK, MOBILE_MONEY]
        titulaire:
          type: string
        banque:
          type: string
          nullable: true
        numeroCompte:
          type: string
          nullable: true
        numeroTelephone:
          type: string
          nullable: true
        solde:
          type: number

    FinancialAccountListResponse:
      type: object
      properties:
        comptes:
          type: array
          items:
            $ref: '#/components/schemas/FinancialAccountResponse'

    PaymentResponse:
      type: object
      properties:
        message:
          type: string
        paiementsTraites:
          type: integer
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string