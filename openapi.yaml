openapi: 3.0.3
info:
  title: Federation API
  version: 0.0.2
  description: API de gestion des membres, collectivités et sponsors

servers:
  - url: http://localhost:8080

paths:

  /members:
    post:
      summary: Créer un membre avec sponsors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRequest'
      responses:
        "200":
          description: Membre créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'

  /collectivities:
    post:
      summary: Créer une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collectivity'
      responses:
        "200":
          description: Collectivité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'

  /collectivities/{id}/assign:
    put:
      summary: Attribution du numéro et du nom unique à une collectivité
      description: Fonction J - assignation du numéro et du nom unique
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityAssignRequest'
      responses:
        "200":
          description: Collectivité mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'

components:

  schemas:

    MemberRequest:
      type: object
      required:
        - firstName
        - lastName
        - birthDate
        - gender
        - phone
        - email
        - collectivityId
        - sponsorIds
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        admissionDate:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        address:
          type: string
        job:
          type: string
        phone:
          type: string
        email:
          type: string
        collectivityId:
          type: integer
        sponsorIds:
          type: array
          items:
            type: integer

    Member:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        admissionDate:
          type: string
          format: date
        gender:
          type: string
        address:
          type: string
        job:
          type: string
        phone:
          type: string
        email:
          type: string

    Collectivity:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        name:
          type: string
        speciality:
          type: string
        creationDate:
          type: string
          format: date
        city:
          type: object
          properties:
            id:
              type: integer

    CollectivityAssignRequest:
      type: object
      required:
        - number
        - name
      properties:
        number:
          type: string
          example: "COL001"
        name:
          type: string
          example: "Collectif Riz"
