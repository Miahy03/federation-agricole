openapi: 3.0.3
info:
  title: Fédération des Collectivités Agricoles
  version: 2.0.0
  description: API complète

servers:
  - url: http://localhost:8080

paths:


  /collectivites:
    post:
      summary: Créer une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Collectivite'
      responses:
        '201':
          description: Collectivité créée

  /collectivites/{collectiviteId}/members:
    post:
      summary: Admettre un membre
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
      responses:
        '201':
          description: Membre admis
        '400':
          description: Conditions non respectées

  /collectivites/{collectiviteId}/cotisations:
    post:
      summary: Ajouter une cotisation
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cotisation'
      responses:
        '201':
          description: Cotisation enregistrée


  /collectivites/{collectiviteId}/comptes:
    post:
      summary: Ajouter un compte
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Compte'
      responses:
        '201':
          description: Compte ajouté

  /collectivites/{collectiviteId}/activites:
    post:
      summary: Créer une activité
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activite'
      responses:
        '201':
          description: Activité créée

  /activites/{activiteId}/presence:
    post:
      summary: Enregistrer présence
      parameters:
        - name: activiteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Presence'
      responses:
        '200':
          description: Présence enregistrée

  /collectivites/{collectiviteId}/statistiques:
    get:
      summary: Statistiques d’une collectivité
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistiques collectivité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatCollectivite'

  /federation/statistics:
    get:
      summary: Statistiques globales de la fédération
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistiques fédération
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatFederation'

components:

  schemas:

    Collectivite:
      type: object
      required:
        - name
        - ville
        - specialite
      properties:
        name:
          type: string
        ville:
          type: string
        specialite:
          type: string

    Sponsor:
      type: object
      required:
        - memberId
        - collectiviteId
        - relation
      properties:
        memberId:
          type: integer
        collectiviteId:
          type: integer
        relation:
          type: string
          example: ami

    NewMember:
      type: object
      required:
        - firstName
        - lastName
        - birthDate
        - sponsors
        - adhesionFee
        - annualContribution
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE]
        address:
          type: string
        job:
          type: string
        phone:
          type: string
        email:
          type: string

        sponsors:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Sponsor'

        adhesionFee:
          type: number
          example: 50000

        annualContribution:
          type: number
          example: 200000

    Cotisation:
      type: object
      properties:
        montant:
          type: number
        date:
          type: string
          format: date
        modePaiement:
          type: string
          enum: [ESPECE, VIREMENT, MOBILE_MONEY]

    Compte:
      type: object
      properties:
        type:
          type: string
          enum: [CAISSE, BANCAIRE, MOBILE_MONEY]
        titulaire:
          type: string
        banque:
          type: string
        numeroCompte:
          type: string
        telephone:
          type: string
        solde:
          type: number

    Activite:
      type: object
      properties:
        nom:
          type: string
        date:
          type: string
          format: date
        obligatoire:
          type: boolean

    Presence:
      type: object
      properties:
        memberId:
          type: integer
        present:
          type: boolean
        excuse:
          type: boolean

    StatCollectivite:
      type: object
      properties:
        attendanceRate:
          type: number
        totalMembers:
          type: integer
        members:
          type: array
          items:
            type: object
            properties:
              memberId:
                type: integer
              attendanceRate:
                type: number
              totalPaid:
                type: number
              unpaidAmount:
                type: number

    StatFederation:
      type: object
      properties:
        collectivites:
          type: array
          items:
            type: object
            properties:
              collectiviteId:
                type: integer
              attendanceRate:
                type: number
              upToDateMembersPercentage:
                type: number
              newMembersCount:
                type: integer